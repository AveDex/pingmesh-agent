setting:
  # the maximum amount of concurrent to ping, uint
  concurrent_limit: 20
  # interval to exec ping in seconds, float
  interval: 15.0
  # The maximum delay time to ping in milliseconds, float
  delay: 200
  # ping timeout in seconds, float
  timeout: 2.0
  # send ip addr
  source_ip_addr: 0.0.0.0
  # send ip protocal
  ip_protocol: ip4

mesh:
  ave: 
    name: ping
    type: OtherIP
    ips :
      - hkb-backend-prod-jumper01.ave
      - hkc-data-prod-jumper01.ave
      - hkb-infra-prod-jumper01.ave
      - hkb-trading-prod-jumper01.ave
      - aws-hk01-pingmesh-agent.ave
